name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Generator tests and Windows PowerShell 5.1 / PowerShell 7 acceptance
        shell: pwsh
        run: ./scripts/Test-Release.ps1 -ArtifactsPath "$env:RUNNER_TEMP/qlikcloud-ci"
      - name: Upload validation reports and review package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qlikcloud-validation
          path: |
            ${{ runner.temp }}/qlikcloud-ci/test-results
            ${{ runner.temp }}/qlikcloud-ci/build/**/test-results/*.json
            ${{ runner.temp }}/qlikcloud-ci/packages/*.zip
            ${{ runner.temp }}/qlikcloud-ci/packages/*.sha256
          if-no-files-found: warn
          retention-days: 14
